ports_description:
  3000/tcp: "Recipe Box web UI. Install the app to your phone's home screen from this address."
webui: "http://[HOST]:[PORT:3000]/"
options:
  password: "changeme"
  session_secret: ""
schema:
  password: str
  session_secret: str
